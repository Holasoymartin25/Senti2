<header class="navbar">
  <div class="logo" routerLink="/inicio">Senti2</div>

  <nav aria-label="Navegación principal">
    <a routerLink="/inicio" routerLinkActive="active">Inicio</a> <a routerLink="/servicios"
      routerLinkActive="active">Servicios</a>
    <a routerLink="/psicologos" routerLinkActive="active">Psicólogos</a>
    <a routerLink="/origen" routerLinkActive="active">Origen</a>
    <a routerLink="/contacto" routerLinkActive="active">Contacto</a>

    @if (isAuthenticated) {
    @if (userRole === 'admin' || userRole === 'psicologo') {
    <a routerLink="/admin" routerLinkActive="active" class="nav-link-with-badge">
      Panel Admin
      <span *ngIf="unreadMessagesCount > 0" class="nav-badge">{{ unreadMessagesCount }}</span>
    </a>
    }
    <a routerLink="/area-personal" routerLinkActive="active" class="nav-link-with-badge">
      Área Personal
      <span *ngIf="unreadMessagesCount > 0 && userRole !== 'psicologo' && userRole !== 'admin'" class="nav-badge">{{ unreadMessagesCount }}</span>
    </a>
    <a routerLink="/perfil" routerLinkActive="active" class="profile-link">
      <span class="user-name" [title]="userEmail || 'Mi Perfil'">
        {{ displayName }}
      </span>
    </a>
    } @else {
    <a routerLink="/login" routerLinkActive="active">Login</a>
    }
  </nav>
</header>
