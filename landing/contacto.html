<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacto Senti2.">
  <title>Contacto — Senti2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>

  <header class="header" role="banner">
    <div class="container header__inner">
      <a class="header__brand" href="index.html">
        <img class="header__logo" src="assets/logo.svg" alt="" width="36" height="36">
        Senti2
      </a>
      <nav class="header__nav" aria-label="Navegación principal">
        <a class="header__link" href="index.html">Inicio</a>
        <a class="header__link" href="servicios.html">Servicios</a>
        <a class="header__link" href="psicologos.html">Psicólogos</a>
        <a class="header__link" href="origen.html">Origen</a>
        <a class="header__link header__link--active" href="contacto.html" aria-current="page">Contacto</a>
        <a class="header__link btn btn--primary" href="/">Entrar a la app</a>
      </nav>
    </div>
  </header>

  <main id="contenido-principal">
    <div class="container layout">
      <div class="layout__main">
        <h1 class="page-title">Contacto</h1>
        <p class="intro">Escríbenos si tienes dudas sobre Senti2.</p>

        <form class="form" id="contact-form" action="#" method="post">
          <div class="form__group">
            <label class="form__label" for="nombre">Nombre</label>
            <input class="form__input" type="text" id="nombre" name="nombre" required>
          </div>
          <div class="form__group">
            <label class="form__label" for="apellidos">Apellidos</label>
            <input class="form__input" type="text" id="apellidos" name="apellidos" required>
          </div>
          <div class="form__group">
            <label class="form__label" for="email">Email</label>
            <input class="form__input" type="email" id="email" name="email" required>
          </div>
          <div class="form__group">
            <label class="form__label" for="mensaje">Mensaje</label>
            <textarea class="form__textarea" id="mensaje" name="mensaje" required rows="4"></textarea>
          </div>
          <button class="btn btn--primary" type="submit">Enviar</button>
          <p class="form__feedback" id="contact-feedback" role="status" hidden></p>
        </form>
      </div>

      <aside class="sidebar" aria-label="Barra lateral">
        <img class="sidebar__image" src="assets/contact.jpg" alt="Persona escribiendo notas" width="280" height="200">
        <p class="sidebar__title">App Senti2</p>
        <ul class="sidebar__nav">
          <li><a href="/">Iniciar sesión</a></li>
          <li><a href="servicios.html">Servicios</a></li>
        </ul>
      </aside>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container footer__inner">
      <p class="footer__brand">Senti2</p>
      <ul class="footer__links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="/">App</a></li>
      </ul>
      <p class="footer__copy">&copy; 2025–2026 Senti2</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
