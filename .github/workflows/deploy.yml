name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-aws:
    name: Deploy AWS (EC2 + Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
      APP_KEY: ${{ secrets.APP_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_DEPLOY_TOKEN,APP_KEY,NEON_DATABASE_URL
          script: |
            set -e
            sudo git config --global --add safe.directory /app
            cd /app
            if [ -n "$GH_DEPLOY_TOKEN" ]; then
              sudo git remote set-url origin "https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/Holasoymartin25/Senti2.git"
            fi
            sudo git fetch origin
            sudo git reset --hard origin/main
            cd /app/Senti2
            EC2_HOST="${{ secrets.EC2_HOST }}"
            {
              echo "APP_NAME=Senti2"
              echo "APP_ENV=production"
              echo "APP_KEY=${APP_KEY}"
              echo "APP_DEBUG=false"
              echo "APP_URL=http://${EC2_HOST}"
              echo "APP_TIMEZONE=UTC"
              echo "FRONTEND_URL=http://${EC2_HOST}"
              echo "LOG_CHANNEL=stack"
              echo "DB_CONNECTION=pgsql"
              echo "DB_URL=${NEON_DATABASE_URL}"
              echo "MAIL_MAILER=log"
              echo "BROADCAST_CONNECTION=reverb"
              echo "REVERB_APP_ID=senti2"
              echo "REVERB_APP_KEY=senti2-key"
              echo "REVERB_APP_SECRET=senti2-secret"
              echo "REVERB_HOST=${EC2_HOST}"
              echo "REVERB_PORT=80"
              echo "REVERB_SCHEME=http"
              echo "SESSION_DRIVER=file"
              echo "CACHE_STORE=file"
              echo "QUEUE_CONNECTION=sync"
            } | sudo tee senti2-backend/.env > /dev/null
            sudo docker compose down --remove-orphans || true
            sudo docker compose up -d --build
            sudo docker compose ps
            curl -fsI http://localhost | head -1
