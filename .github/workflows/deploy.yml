name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-aws:
    name: Deploy AWS (EC2 + Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_KEY,NEON_DATABASE_URL,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u holasoymartin25 --password-stdin

            sudo curl -fsSL \
              "https://raw.githubusercontent.com/Holasoymartin25/Senti2/main/docker-compose.yml" \
              -o /app/docker-compose.yml

            {
              echo "APP_NAME=Senti2"
              echo "APP_ENV=production"
              echo "APP_KEY=${APP_KEY}"
              echo "APP_DEBUG=false"
              echo "APP_URL=https://senti2.duckdns.org"
              echo "APP_TIMEZONE=UTC"
              echo "FRONTEND_URL=https://senti2.duckdns.org"
              echo "LOG_CHANNEL=stack"
              echo "DB_CONNECTION=pgsql"
              echo "DB_URL=${NEON_DATABASE_URL}"
              echo "MAIL_MAILER=log"
              echo "MAIL_CONTACT_TO=senti2soporte@gmail.com"
              echo "BROADCAST_CONNECTION=reverb"
              echo "REVERB_APP_ID=senti2"
              echo "REVERB_APP_KEY=senti2-key"
              echo "REVERB_APP_SECRET=senti2-secret"
              echo "REVERB_HOST=senti2.duckdns.org"
              echo "REVERB_PORT=443"
              echo "REVERB_SCHEME=https"
              echo "SESSION_DRIVER=file"
              echo "SESSION_SECURE_COOKIE=true"
              echo "CACHE_STORE=file"
              echo "QUEUE_CONNECTION=sync"
            } | sudo tee /app/senti2-backend/.env > /dev/null

            cd /app
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker compose ps
            curl -fsk https://senti2.duckdns.org | head -c 50 && echo " OK"
